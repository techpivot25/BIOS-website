<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="100%" height="100%">
  <defs>
    <style>
      .super-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14.5px; font-weight: 700; fill: #64748b; letter-spacing: 0.1em; text-anchor: middle; text-transform: uppercase; }
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #2d3748; text-anchor: middle; }
      .pillar-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14.5px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .tenant-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #2d3748; text-anchor: middle; }
      .brand-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .office-text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 25px; font-weight: 600; fill: #d83b01; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1040" height="500" fill="#ffffff" />

  <!-- Super Title -->
  <text x="520" y="34" class="super-label">A SIMPLE AND EFFECTIVE SOLUTION</text>

  <!-- Main Headline -->
  <text x="520" y="78" class="main-title">Market leading solution for M365 Data Protection</text>

  <!-- =================================================================== -->
  <!-- TOP 4 VALUE PILLARS (All 4 icons vertically aligned on y=135)       -->
  <!-- =================================================================== -->

  <!-- Pillar 1: Complete Office 365 Protection (x=130) -->
  <g transform="translate(130, 0)">
    <!-- Icon centered at y=135 -->
    <g transform="translate(0, 135)">
      <!-- Shield outline -->
      <path d="M 0, -22 C 16, -22 21, -16 21, -2 C 21, 14 9, 23 0, 26 C -9, 23 -21, 14 -21, -2 C -21, -16 -16, -22 0, -22 Z" 
            fill="none" stroke="#00adef" stroke-width="2.6" stroke-linejoin="round" />
      <!-- Head -->
      <circle cx="0" cy="-6" r="4.8" fill="none" stroke="#00adef" stroke-width="2.4" />
      <!-- Torso -->
      <path d="M -9, 10 C -9, 3 9, 3 9, 10" fill="none" stroke="#00adef" stroke-width="2.4" stroke-linecap="round" />
    </g>
    <!-- Label aligned at y=182, 202 -->
    <text x="0" y="182" class="pillar-text">Complete Office 365</text>
    <text x="0" y="202" class="pillar-text">Protection</text>
  </g>

  <!-- Pillar 2: Unlimited Storage & Retention (x=390) -->
  <g transform="translate(390, 0)">
    <!-- Icon centered at y=135 -->
    <g transform="translate(0, 135)">
      <!-- Storage chassis -->
      <rect x="-18" y="-22" width="34" height="42" rx="4" fill="none" stroke="#00adef" stroke-width="2.6" />
      <line x1="-18" y1="-8" x2="16" y2="-8" stroke="#00adef" stroke-width="2.2" />
      <line x1="-18" y1="6" x2="16" y2="6" stroke="#00adef" stroke-width="2.2" />
      <circle cx="-11" cy="-15" r="1.6" fill="#00adef" />
      <circle cx="-11" cy="-1" r="1.6" fill="#00adef" />
      <!-- Checkmark Badge on lower right -->
      <circle cx="13" cy="13" r="10" fill="#ffffff" stroke="#00adef" stroke-width="2.4" />
      <polyline points="9,13 12,16 18,9" fill="none" stroke="#00adef" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <!-- Label aligned at y=182, 202 -->
    <text x="0" y="182" class="pillar-text">Unlimited Storage</text>
    <text x="0" y="202" class="pillar-text">&amp; Retention</text>
  </g>

  <!-- Pillar 3: Easy set up & Management (x=650) -->
  <g transform="translate(650, 0)">
    <!-- Icon centered at y=135 -->
    <g transform="translate(0, 135)">
      <rect x="-20" y="-20" width="40" height="40" rx="5" fill="none" stroke="#00adef" stroke-width="2.6" />
      <polyline points="-10, -1 -2, 7 12, -7" fill="none" stroke="#00adef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <!-- Label aligned at y=182, 202 -->
    <text x="0" y="182" class="pillar-text">Easy set up</text>
    <text x="0" y="202" class="pillar-text">&amp; Management</text>
  </g>

  <!-- Pillar 4: Flexible purchase & deployment (x=910) -->
  <g transform="translate(910, 0)">
    <!-- Icon centered at y=135 -->
    <g transform="translate(0, 135)">
      <!-- Handshake exact vector -->
      <path d="M -22, -10 L -12, -20 L -2, -10 L -9, -3" fill="none" stroke="#00adef" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 22, -10 L 12, -20 L 2, -10 L 9, -3" fill="none" stroke="#00adef" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -16, -4 L -8, 4 L 0, 12 L 8, 4 L 16, -4" fill="none" stroke="#00adef" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -10, 2 L -4, 8 L 0, 12 L 4, 8 L 10, 2" fill="none" stroke="#00adef" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -22, -6 L -16, 0" fill="none" stroke="#00adef" stroke-width="2.4" stroke-linecap="round" />
      <path d="M 22, -6 L 16, 0" fill="none" stroke="#00adef" stroke-width="2.4" stroke-linecap="round" />
    </g>
    <!-- Label aligned at y=182, 202 -->
    <text x="0" y="182" class="pillar-text">Flexible purchase</text>
    <text x="0" y="202" class="pillar-text">&amp; deployment</text>
  </g>

  <!-- =================================================================== -->
  <!-- MIDDLE DIVIDER: Complete protection across the Office 365 tenant    -->
  <!-- =================================================================== -->
  <text x="520" y="258" class="tenant-title">Complete protection across the Office 365 tenant</text>

  <!-- Horizontal divider lines and authentic Office 365 brand logo -->
  <g transform="translate(0, 298)">
    <!-- Left red-orange divider line -->
    <line x1="30" y1="0" x2="410" y2="0" stroke="#ea580c" stroke-width="2" />

    <!-- Exact Office 365 Logo (Centered) -->
    <g transform="translate(436, -16)">
      <!-- Microsoft Office Red-Orange Tile -->
      <rect x="0" y="2" width="28" height="28" rx="4" fill="#d83b01" />
      <!-- Inner geometric window shapes matching official Office logo -->
      <path d="M 7, 7 L 21, 7 L 21, 25 L 7, 25 Z" fill="#ffffff" fill-opacity="0.95" />
      <path d="M 10, 10 L 18, 10 L 18, 22 L 10, 22 Z" fill="#d83b01" />
      <!-- Office 365 Wordmark -->
      <text x="38" y="24" class="office-text">Office 365</text>
    </g>

    <!-- Right red-orange divider line -->
    <line x1="630" y1="0" x2="1010" y2="0" stroke="#ea580c" stroke-width="2" />
  </g>

  <!-- =================================================================== -->
  <!-- BOTTOM 5 EXACT MICROSOFT BRAND LOGOS (All aligned vertically on y=385)-->
  <!-- =================================================================== -->

  <!-- Brand 1: Exchange Online (x=110) -->
  <g transform="translate(110, 0)">
    <!-- Exact Official Exchange Brand Icon at y=385 -->
    <g transform="translate(0, 385)">
      <!-- Envelope behind (Right) -->
      <path d="M -4, -18 L 18, -18 C 22, -18 24, -16 24, -12 L 24, 12 C 24, 16 22, 18 18, 18 L -4, 18 Z" fill="#0072c6" />
      <!-- Envelope fold lines -->
      <path d="M 0, -18 L 14, -4 L 24, -13" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
      <path d="M 0, 18 L 13, 5 L 24, 14" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M 14, -4 L 14, 6" fill="none" stroke="#ffffff" stroke-width="1.8" />
      <!-- Front Tile: Exchange 'E' (Left) -->
      <rect x="-24" y="-20" width="30" height="40" rx="3.5" fill="#0078d4" />
      <!-- White Letter 'E' -->
      <text x="-9" y="8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>
    </g>
    <!-- Label -->
    <text x="0" y="440" class="brand-title">Exchange Online</text>
  </g>

  <!-- Brand 2: SharePoint (x=315) -->
  <g transform="translate(315, 0)">
    <!-- Exact Official SharePoint Brand Icon at y=385 -->
    <g transform="translate(0, 385)">
      <!-- Three overlapping circular nodes behind (Right) -->
      <circle cx="14" cy="-10" r="8.5" fill="#038387" />
      <circle cx="18" cy="7" r="7" fill="#005b60" />
      <circle cx="2" cy="11" r="7.5" fill="#00757a" />
      <!-- Network connections between nodes -->
      <line x1="14" y1="-10" x2="18" y2="7" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
      <line x1="2" y1="11" x2="18" y2="7" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
      <!-- Front Tile: SharePoint 'S' (Left) -->
      <rect x="-24" y="-20" width="30" height="40" rx="3.5" fill="#008272" />
      <!-- White Letter 'S' -->
      <text x="-9" y="8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    </g>
    <!-- Label -->
    <text x="0" y="440" class="brand-title">SharePoint</text>
  </g>

  <!-- Brand 3: OneDrive for Business (x=520) -->
  <g transform="translate(520, 0)">
    <!-- Exact Official OneDrive Cloud Icon at y=385 -->
    <g transform="translate(0, 385)">
      <!-- Back Cloud (Darker Blue) -->
      <path d="M -10, -5 C -10, -14 -2, -18 7, -15 C 10, -22 22, -22 27, -15 C 34, -15 39, -9 38, -2 C 43, 0 44, 8 36, 12 L 0, 12 C -6, 12 -10, 6 -10, -5 Z" fill="#004e8c" />
      <!-- Front Cloud (Vibrant Microsoft Blue) -->
      <path d="M -26, 4 C -26, -3 -20, -7 -14, -6 C -11, -14 0, -14 5, -8 C 11, -8 16, -3 15, 3 C 20, 5 20, 14 13, 16 L -20, 16 C -25, 16 -26, 11 -26, 4 Z" fill="#0078d4" />
    </g>
    <!-- Label -->
    <text x="0" y="440" class="brand-title">OneDrive for Business</text>
  </g>

  <!-- Brand 4: Office 365 Groups (x=725) -->
  <g transform="translate(725, 0)">
    <!-- Exact Official Office 365 Groups Icon at y=385 -->
    <g transform="translate(0, 385)">
      <!-- Top Center Member -->
      <circle cx="0" cy="-12" r="6" fill="none" stroke="#0078d4" stroke-width="2.6" />
      <path d="M -7, 1 C -7, -4 7, -4 7, 1" fill="none" stroke="#0078d4" stroke-width="2.4" stroke-linecap="round" />
      
      <!-- Bottom Left Member -->
      <circle cx="-16" cy="4" r="5" fill="none" stroke="#0078d4" stroke-width="2.4" />
      <path d="M -22, 16 C -22, 11 -10, 11 -10, 16" fill="none" stroke="#0078d4" stroke-width="2.2" stroke-linecap="round" />
      
      <!-- Bottom Right Member -->
      <circle cx="16" cy="4" r="5" fill="none" stroke="#0078d4" stroke-width="2.4" />
      <path d="M 10, 16 C 10, 11 22, 11 22, 16" fill="none" stroke="#0078d4" stroke-width="2.2" stroke-linecap="round" />
      
      <!-- Network Interconnect Lines -->
      <line x1="-9" y1="-2" x2="-3" y2="-7" stroke="#0078d4" stroke-width="2" />
      <line x1="9" y1="-2" x2="3" y2="-7" stroke="#0078d4" stroke-width="2" />
      <line x1="-9" y1="8" x2="9" y2="8" stroke="#0078d4" stroke-width="2" />
    </g>
    <!-- Label -->
    <text x="0" y="440" class="brand-title">Office 365 Groups</text>
  </g>

  <!-- Brand 5: Microsoft Teams (x=930) -->
  <g transform="translate(930, 0)">
    <!-- Exact Official Microsoft Teams Brand Icon at y=385 -->
    <g transform="translate(0, 385)">
      <!-- Collaborators behind (Right) -->
      <!-- Back person 1 -->
      <circle cx="14" cy="-12" r="5" fill="#5059c9" />
      <path d="M 8, 2 C 8, -4 20, -4 20, 2 Z" fill="#5059c9" />
      <!-- Back person 2 (Closer) -->
      <circle cx="18" cy="-4" r="4.2" fill="#7b83eb" />
      <path d="M 12, 10 C 12, 4 24, 4 24, 10 Z" fill="#7b83eb" />
      <!-- Front Tile: Teams 'T' (Left) -->
      <rect x="-24" y="-20" width="30" height="40" rx="3.5" fill="#464eb8" />
      <!-- White Letter 'T' -->
      <text x="-9" y="8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle">T</text>
    </g>
    <!-- Label -->
    <text x="0" y="440" class="brand-title">Microsoft Teams</text>
  </g>

</svg>
